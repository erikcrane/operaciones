<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operaciones</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: #f5f5f0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 1rem;
  }

  /* Los botones se crean solos, uno por ejercicio (ver el script de abajo). */
  #botones {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;    /* separación entre botones */
  }

  .ejercicio {
    /* ===== MEDIDAS DE LOS BOTONES: cámbialas aquí ===== */
    width: 80vw;          /* ancho: 80 % del ancho de la pantalla... */
    max-width: 400px;     /* ...pero nunca más de 400 px */
    height: 120px;        /* alto */
    font-size: 2rem;      /* tamaño del texto */
    border-radius: 16px;  /* redondeo de las esquinas */
    /* ================================================== */

    background: #333;
    color: #fff;
    border: none;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .ejercicio:hover   { background: #555; }
  .ejercicio:active  { transform: scale(0.97); }
  .ejercicio:disabled {
    background: #999;
    cursor: wait;
  }

  #estado {
    min-height: 1.5em;
    font-size: 1.1rem;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="botones"></div>
  <p id="estado"></p>

<script>
  const contenedor = document.getElementById("botones");
  const estado = document.getElementById("estado");
  let botones = [];
  let temporizador = null;

  function activarBotones(activos) {
    for (const boton of botones) boton.disabled = !activos;
  }

  // Deja todos los botones desactivados mostrando una cuenta atrás de
  // `segundos`. La espera es común a todos los ejercicios y se configura en
  // servidor.py (ESPERA_SEGUNDOS).
  function cuentaAtras(segundos) {
    clearTimeout(temporizador);
    if (segundos <= 0) {
      for (const boton of botones) boton.textContent = boton.dataset.nombre;
      activarBotones(true);
      return;
    }
    activarBotones(false);
    for (const boton of botones) {
      boton.textContent = boton.dataset.nombre + " (" + segundos + " s)";
    }
    temporizador = setTimeout(() => cuentaAtras(segundos - 1), 1000);
  }

  async function generar(clave) {
    activarBotones(false);
    estado.textContent = "Generando y enviando…";
    let espera = 0;
    try {
      const respuesta = await fetch("/generar/" + clave, { method: "POST" });
      const datos = await respuesta.json();
      estado.textContent = datos.mensaje;
      espera = datos.espera || 0;
    } catch (error) {
      estado.textContent = "No se pudo contactar con el servidor.";
    }
    cuentaAtras(espera);
  }

  // Pide al servidor la lista de ejercicios y crea un botón por cada uno.
  async function cargar() {
    try {
      const respuesta = await fetch("/ejercicios");
      const datos = await respuesta.json();
      for (const ejercicio of datos.ejercicios) {
        const boton = document.createElement("button");
        boton.type = "button";
        boton.className = "ejercicio";
        boton.dataset.nombre = ejercicio.nombre;
        boton.textContent = ejercicio.nombre;
        boton.addEventListener("click", () => generar(ejercicio.clave));
        contenedor.appendChild(boton);
        botones.push(boton);
      }
      // Si se recarga la página durante la espera, la cuenta atrás sigue.
      cuentaAtras(datos.espera || 0);
    } catch (error) {
      estado.textContent = "No se pudo contactar con el servidor.";
    }
  }

  cargar();
</script>
</body>
</html>
